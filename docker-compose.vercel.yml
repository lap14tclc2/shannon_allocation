services:
  postgres:
    image: postgres:16-alpine
    container_name: qport-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: qport
      POSTGRES_USER: qport
      POSTGRES_PASSWORD: qport
    ports:
      - "5432:5432"
    volumes:
      - qport_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qport -d qport"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  qport_postgres_data:
