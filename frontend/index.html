<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#efe4cf" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="QPort" />
    <meta name="description" content="QPort — hệ thống theo dõi danh mục đầu tư Mua & Nắm giữ cho nhà đầu tư Việt Nam" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📈</text></svg>" />
    <title>QPort — Danh mục</title>
    <script>
      (() => {
        try {
          const stored = localStorage.getItem('qport-theme-v1');
          const theme = stored === 'cyber' ? 'cyber' : 'retro';
          const colorScheme = theme === 'retro' ? 'light' : 'dark';
          document.documentElement.dataset.theme = colorScheme;
          document.documentElement.dataset.visualTheme = theme;
          document.documentElement.style.colorScheme = colorScheme;
          document.querySelector('meta[name="theme-color"]')?.setAttribute('content', theme === 'cyber' ? '#080b14' : '#efe4cf');
        } catch {
          document.documentElement.dataset.theme = 'light';
          document.documentElement.dataset.visualTheme = 'retro';
          document.documentElement.style.colorScheme = 'light';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/entry-vercel.jsx"></script>
  </body>
</html>
