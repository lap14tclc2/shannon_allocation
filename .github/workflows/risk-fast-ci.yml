name: QPort Buy-and-Hold Core CI

on:
  push:
    branches: [main]
    paths:
      - 'python/portfolio/**'
      - 'python/serve.py'
      - 'python/buyhold_server.py'
      - 'python/requirements*.txt'
      - 'frontend/**'
      - '.github/workflows/risk-fast-ci.yml'
  pull_request:
    paths:
      - 'python/portfolio/**'
      - 'python/serve.py'
      - 'python/buyhold_server.py'
      - 'python/requirements*.txt'
      - 'frontend/**'
      - '.github/workflows/risk-fast-ci.yml'
  workflow_dispatch:

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: python/requirements.txt
      - name: Install Python dependencies
        working-directory: python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Compile operational Python
        working-directory: python
        run: python -m compileall -q portfolio buyhold_server.py serve.py main.py
      - name: Buy-and-hold core tests
        working-directory: python
        run: python -m pytest portfolio/tests -q

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Client validation contract
        working-directory: frontend
        run: node test/validation.mjs
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - name: Build SSR
        working-directory: frontend
        run: npm run build:ssr
      - name: Operational SSR/hydration smoke
        working-directory: frontend
        run: node test/smoke.mjs
      - name: AI export contract
        working-directory: frontend
        run: node test/ai-export.mjs
