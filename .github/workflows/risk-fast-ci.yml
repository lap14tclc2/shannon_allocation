name: QPort Vercel Migration CI

on:
  push:
    branches: [main, vercel-migration]
    paths:
      - 'app/**'
      - 'python/portfolio/**'
      - 'python/requirements*.txt'
      - 'frontend/**'
      - 'scripts/**'
      - 'pyproject.toml'
      - 'vercel.json'
      - '.github/workflows/risk-fast-ci.yml'
  pull_request:
    paths:
      - 'app/**'
      - 'python/portfolio/**'
      - 'python/requirements*.txt'
      - 'frontend/**'
      - 'scripts/**'
      - 'pyproject.toml'
      - 'vercel.json'
      - '.github/workflows/risk-fast-ci.yml'
  workflow_dispatch:

jobs:
  core:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: qport
          POSTGRES_USER: qport
          POSTGRES_PASSWORD: qport
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U qport -d qport"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://qport:qport@127.0.0.1:5432/qport
      QPORT_ADMIN_PASSWORD: ci-admin-password
      QPORT_COOKIE_SECURE: '0'
      CRON_SECRET: ci-cron-secret

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: python/requirements.txt

      - name: Install Python dependencies
        working-directory: python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile Vercel Python runtime
        run: python -m compileall -q app python/portfolio scripts/migrate_sqlite_to_postgres.py

      - name: Existing buy-and-hold regression suite
        working-directory: python
        run: python -m pytest portfolio/tests -q

      - name: PostgreSQL Vercel integration smoke
        working-directory: python
        run: python -m pytest portfolio/tests/test_postgres_vercel_runtime.py -q

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Client validation contract
        working-directory: frontend
        run: node test/validation.mjs

      - name: Broker-specific holding book contract
        working-directory: frontend
        run: node test/holding-books.mjs

      - name: Build Vercel SPA
        working-directory: frontend
        run: npm run build

      - name: AI export contract
        working-directory: frontend
        run: node test/ai-export.mjs

      - name: Assert Vercel artifact exists
        run: |
          test -f frontend/dist/index.html
          test -f app/main.py
          test -f vercel.json
