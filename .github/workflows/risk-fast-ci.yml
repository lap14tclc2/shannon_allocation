name: Risk-aware optimizer CI

on:
  push:
    branches: [main]
    paths:
      - 'python/**'
      - 'frontend/**'
      - '.github/workflows/risk-fast-ci.yml'
  pull_request:
    paths:
      - 'python/**'
      - 'frontend/**'
      - '.github/workflows/risk-fast-ci.yml'
  workflow_dispatch:

jobs:
  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: python/requirements.txt
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - name: Compile Python
        run: python -m compileall -q backtest main.py optimize_main.py serve.py
      - name: Dataset-independent optimizer regression tests
        # TestCostsAndLookahead intentionally reads F:/data_finance/data and is
        # exercised in the real-data/local environment; GitHub runners do not
        # have that private historical dataset.
        run: python -m pytest backtest/tests/test_optimizer.py backtest/tests/test_risk_fast_optimizer.py backtest/tests/test_window_accounting.py backtest/tests/test_fixed_combination_contract.py backtest/tests/test_combination_health.py backtest/tests/test_variable_allocation.py backtest/tests/test_live_risk_reward_policy.py -q -k "not TestCostsAndLookahead"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run build:ssr
      - run: node test/smoke.mjs
