name: QPort Research Regression (Manual)

on:
  workflow_dispatch:

jobs:
  research:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: python/requirements.txt
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - name: Compile research engine
        run: python -m compileall -q backtest research_main.py optimize_main.py research_legacy_server.py
      - name: Dataset-independent research regressions
        # Real-data tests that read the developer's private F:/data_finance/data
        # remain local by design and are excluded from GitHub runners.
        run: >-
          python -m pytest
          backtest/tests/test_optimizer.py
          backtest/tests/test_risk_fast_optimizer.py
          backtest/tests/test_window_accounting.py
          backtest/tests/test_fixed_combination_contract.py
          backtest/tests/test_combination_health.py
          backtest/tests/test_variable_allocation.py
          backtest/tests/test_live_risk_reward_policy.py
          backtest/tests/test_risk_policy_initialization.py
          backtest/tests/test_dynamic_alpha.py
          -q -k "not TestCostsAndLookahead"
